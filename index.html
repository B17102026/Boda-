<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Boda 💍</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: #111;
  background: #ffffff;
}

.header {
  position: relative;
  padding: 120px 20px 30px;
  overflow: hidden;
}

.header-illustration {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 520px;
  opacity: 0.14;
  pointer-events: none;
}

.header-content {
  position: relative;
  z-index: 2;
}

.title {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  line-height: 1.1;
  margin-bottom: 10px;
}

.text {
  font-size: 18px;
  color: #444;
  margin-bottom: 40px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.btn {
  background: linear-gradient(145deg, #111, #333);
  color: white;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform 0.12s ease;
}

.btn:active {
  transform: translateY(5px) scale(0.97);
}

/* GALERÍA */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 25px;
}

/* 🟡 POLAROID RETRO */
.polaroid {
  background: #fff;
  padding: 10px 10px 28px;
  border-radius: 6px;
  box-shadow: 0 12px 28px rgba(0,0,0,0.18);
  transform: rotate(var(--r));
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.polaroid:hover {
  transform: scale(1.03) rotate(0deg);
  box-shadow: 0 18px 40px rgba(0,0,0,0.25);
}

.polaroid img,
.polaroid video {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 6px;
}

/* TEXTO POLAROID */
.caption {
  font-size: 13px;
  color: #111;
  margin-top: 8px;
  font-family: 'Playfair Display', serif;
}

/* VISOR */
.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.viewer img,
.viewer video {
  max-width: 95%;
  max-height: 90%;
}

/* iOS OVERLAY */
.iosOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20000;
}

.iosPreviewBox {
  display: flex;
  align-items: center;
  gap: 18px;
}

.iosPreviewMedia {
  width: 65vw;
  max-width: 420px;
  height: 70vh;
  border-radius: 20px;
  overflow: hidden;
  background: black;
  box-shadow: 0 25px 70px rgba(0,0,0,0.4);
}

.iosPreviewMedia img,
.iosPreviewMedia video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.iosMenu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.iosMenu button {
  background: rgba(255,255,255,0.9);
  border: none;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 14px;
  cursor: pointer;
  min-width: 120px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.15);
}

</style>
</head>

<body>

<div class="header">

<!-- 👰🤵 NOVIOS (FONDO RESTAURADO) -->
<svg class="header-illustration" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" width="6" height="6">
      <path d="M0 0 L6 6" stroke="#000" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- NOVIA -->
  <path d="M220 80 C200 120,210 160,230 200 C250 260,190 310,170 360 L290 360 C270 300,220 260,250 200 C270 160,280 120,260 80 Z"
        fill="url(#hatch)" stroke="#000"/>

  <circle cx="240" cy="60" r="14" fill="url(#hatch)" stroke="#000"/>

  <!-- NOVIO -->
  <path d="M380 90 L350 160 L360 360 L420 360 L410 160 Z"
        fill="url(#hatch)" stroke="#000"/>

  <circle cx="385" cy="60" r="14" fill="url(#hatch)" stroke="#000"/>
</svg>

  <div class="header-content">
    <div class="title">Recuerdos de un día<br>inolvidable</div>
    <div class="text">Conservados para siempre.</div>

    <div class="buttons">
      <div class="btn" onclick="fileInput.click()">SUBIR FOTO 📁</div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

<div class="gallery" id="gallery"></div>

<!-- iOS MENU -->
<div class="iosOverlay" id="iosOverlay">
  <div class="iosPreviewBox">
    <div class="iosPreviewMedia" id="iosMedia"></div>
    <div class="iosMenu">
      <button onclick="shareFile()">Compartir</button>
      <button onclick="downloadFile()">Descargar</button>
      <button onclick="deleteFile()">Borrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = "https://evmvzqorclndjyghfpch.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bXZ6cW9yY2xuZGp5Z2hmcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjMwOTQsImV4cCI6MjA5MzI5OTA5NH0.tZHpboRzPgnPZ6RjuCWEO-PgcMgIrrUQ8EqQgnnj_Mk";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");

const iosOverlay = document.getElementById("iosOverlay");
const iosMedia = document.getElementById("iosMedia");

let selectedFile = null;
let selectedUrl = null;
let selectedIsVideo = false;

/* IOS */
function openIOS(file, url, isVideo) {

  selectedFile = file;
  selectedUrl = url;
  selectedIsVideo = isVideo;

  iosMedia.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  iosMedia.appendChild(el);
  iosOverlay.style.display = "flex";
}

iosOverlay.addEventListener("click", (e) => {
  if (e.target === iosOverlay) iosOverlay.style.display = "none";
});

/* acciones */
function shareFile() {
  navigator.share?.({ url: selectedUrl });
}

function downloadFile() {
  const a = document.createElement("a");
  a.href = selectedUrl;
  a.download = "";
  a.click();
}

function deleteFile() {
  const key = prompt("Clave:");
  if (key !== "17102026") return;

  client.storage.from("fotos").remove([selectedFile]);
  iosOverlay.style.display = "none";
  loadFiles();
}

/* UPLOAD - 1 TEXTO PARA TODAS */
fileInput.addEventListener("change", async (e) => {

  const files = e.target.files;
  if (!files.length) return;

  const caption = prompt("Escribe un texto para TODAS las fotos (opcional):") || "";
  const safeCaption = caption.replaceAll(" ", "_");

  for (let f of files) {
    const name = Date.now() + "__" + safeCaption + "__" + f.name;
    await client.storage.from("fotos").upload(name, f);
  }

  loadFiles();
});

/* LOAD */
async function loadFiles() {

  gallery.innerHTML = "";

  const { data } = await client.storage.from("fotos").list("", { limit: 200 });

  for (let file of data) {

    if (!file?.name?.includes("__")) continue;

    const parts = file.name.split("__");
    const caption = parts[1]?.replaceAll("_", " ") || "";

    const lower = file.name.toLowerCase();

    const isImage = /\.(jpg|jpeg|png|webp|gif)$/.test(lower);
    const isVideo = /\.(mp4|mov|webm)$/.test(lower);

    if (!isImage && !isVideo) continue;

    const { data: url } = client.storage.from("fotos").getPublicUrl(file.name);

    const wrapper = document.createElement("div");
    wrapper.className = "polaroid";
    wrapper.style.setProperty("--r", (Math.random()*6 - 3) + "deg");

    const el = document.createElement(isVideo ? "video" : "img");
    el.src = url.publicUrl;

    el.addEventListener("click", () => openIOS(file.name, url.publicUrl, isVideo));

    wrapper.appendChild(el);

    if (caption) {
      const cap = document.createElement("div");
      cap.className = "caption";
      cap.innerText = caption;
      wrapper.appendChild(cap);
    }

    gallery.appendChild(wrapper);
  }
}

loadFiles();

</script>

</body>
</html>
