<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Boda 💍</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: #111;
  background: #ffffff;
}

.header {
  position: relative;
  padding: 120px 20px 30px;
  overflow: hidden;
}

.header-illustration {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 520px;
  opacity: 0.14;
  pointer-events: none;
}

.header-content {
  position: relative;
  z-index: 2;
}

.title {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  line-height: 1.1;
  margin-bottom: 10px;
}

.text {
  font-size: 18px;
  color: #444;
  margin-bottom: 40px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.btn {
  background: linear-gradient(145deg, #111, #333);
  color: white;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform 0.12s ease;
}

.btn:active {
  transform: translateY(5px) scale(0.97);
}

/* GALERÍA */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 25px;
}

.gallery img,
.gallery video {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  cursor: pointer;

  border-radius: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}

/* VISOR GRANDE */
.viewer {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.viewer img,
.viewer video {
  max-width: 95%;
  max-height: 90%;
}

.closeViewer {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 30px;
  color: white;
  cursor: pointer;
}

/* 🔥 OVERLAY iOS STYLE */
.iosOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20000;
  backdrop-filter: blur(8px);
}

.iosSheet {
  width: 85%;
  max-width: 420px;
  background: rgba(255,255,255,0.95);
  border-radius: 22px;
  display: flex;
  overflow: hidden;
  box-shadow: 0 20px 60px rgba(0,0,0,0.35);
}

.iosPreview {
  flex: 1;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
}

.iosPreview img,
.iosPreview video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.iosMenu {
  width: 140px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 10px;
  padding: 12px;
}

.iosMenu button {
  border: none;
  padding: 10px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  background: #f2f2f2;
}

.iosMenu button:active {
  transform: scale(0.96);
}

</style>
</head>

<body>

<div class="header">

<svg class="header-illustration" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" width="6" height="6">
      <path d="M0 0 L6 6" stroke="#000" stroke-width="0.5"/>
    </pattern>
  </defs>

  <path d="M220 80 C200 120,210 160,230 200 C250 260,190 310,170 360 L290 360 C270 300,220 260,250 200 C270 160,280 120,260 80 Z"
        fill="url(#hatch)" stroke="#000"/>

  <circle cx="240" cy="60" r="14" fill="url(#hatch)" stroke="#000"/>

  <path d="M380 90 L350 160 L360 360 L420 360 L410 160 Z"
        fill="url(#hatch)" stroke="#000"/>

  <circle cx="385" cy="60" r="14" fill="url(#hatch)" stroke="#000"/>
</svg>

  <div class="header-content">
    <div class="title">Recuerdos de un día<br>inolvidablo</div>
    <div class="text">Conservados para siempre.</div>

    <div class="buttons">
      <div class="btn" onclick="cameraInput.click()">take FOTO 📷</div>
      <div class="btn" onclick="fileInput.click()">save FOTO 📁</div>
    </div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

<div class="gallery" id="gallery"></div>

<!-- VISOR GRANDE -->
<div class="viewer" id="viewer">
  <div class="closeViewer" onclick="closeViewer()">✕</div>
  <div id="viewerContent"></div>
</div>

<!-- 🔥 iOS MENU -->
<div class="iosOverlay" id="iosOverlay">
  <div class="iosSheet">

    <div class="iosPreview" id="iosPreview"></div>

    <div class="iosMenu">
      <button onclick="shareFile()">Compartir</button>
      <button onclick="downloadFile()">Descargar</button>
      <button onclick="deleteFile()">Borrar</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = "https://evmvzqorclndjyghfpch.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bXZ6cW9yY2xuZGp5Z2hmcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjMwOTQsImV4cCI6MjA5MzI5OTA5NH0.tZHpboRzPgnPZ6RjuCWEO-PgcMgIrrUQ8EqQgnnj_Mk";

const client = supabase.createClient(supabaseUrl, supabaseKey);

const cameraInput = document.getElementById("cameraInput");
const fileInput = document.getElementById("fileInput");
const gallery = document.getElementById("gallery");

const viewer = document.getElementById("viewer");
const viewerContent = document.getElementById("viewerContent");

const iosOverlay = document.getElementById("iosOverlay");
const iosPreview = document.getElementById("iosPreview");

const DELETE_KEY = "17102026";

let selectedFile = null;
let selectedUrl = null;

/* VISOR */
function openViewer(url, isVideo) {
  viewerContent.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  viewerContent.appendChild(el);
  viewer.style.display = "flex";
}

function closeViewer() {
  viewer.style.display = "none";
}

/* iOS MENU */
function openIOS(file, url, isVideo) {
  selectedFile = file;
  selectedUrl = url;

  iosPreview.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  iosPreview.appendChild(el);

  iosOverlay.style.display = "flex";
}

iosOverlay.addEventListener("click", (e) => {
  if (e.target === iosOverlay) iosOverlay.style.display = "none";
});

/* SHARE */
function shareFile() {
  if (navigator.share) {
    navigator.share({ url: selectedUrl });
  } else {
    alert("Compartir no disponible");
  }
}

/* DOWNLOAD */
function downloadFile() {
  const a = document.createElement("a");
  a.href = selectedUrl;
  a.download = "";
  a.click();
}

/* DELETE */
function deleteFile() {
  const key = prompt("Clave:");

  if (key !== DELETE_KEY) return alert("Incorrecto ❌");

  client.storage.from("fotos").remove([selectedFile]);

  iosOverlay.style.display = "none";
  loadFiles();
}

/* UPLOAD */
fileInput.addEventListener("change", uploadFiles);

async function uploadFiles(e) {
  for (let file of e.target.files) {
    const name = Date.now() + "_" + file.name;
    await client.storage.from("fotos").upload(name, file);
  }
  loadFiles();
}

/* LOAD */
async function loadFiles() {
  gallery.innerHTML = "";

  const { data } = await client.storage.from("fotos").list("", { limit: 200 });

  for (let file of data) {

    const name = file?.name;
    if (!name || !name.includes(".")) continue;

    const lower = name.toLowerCase();

    const isImage = /\.(jpg|jpeg|png|webp|gif)$/.test(lower);
    const isVideo = /\.(mp4|mov|webm)$/.test(lower);

    if (!isImage && !isVideo) continue;

    const { data: url } = client.storage.from("fotos").getPublicUrl(name);

    const el = document.createElement(isVideo ? "video" : "img");
    el.src = url.publicUrl;

    /* CLICK */
    el.addEventListener("click", () => openViewer(url.publicUrl, isVideo));

    /* LONG PRESS */
    let press;
    el.addEventListener("touchstart", () => {
      press = setTimeout(() => openIOS(name, url.publicUrl, isVideo), 500);
    });

    el.addEventListener("touchend", () => clearTimeout(press));

    gallery.appendChild(el);
  }
}

loadFiles();

</script>

</body>
</html>
