<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Boda 💍</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: #111;
  background: #f6f1ea; /* 👈 más papel retro */
}

/* HEADER (igual) */
.header {
  position: relative;
  padding: 120px 20px 30px;
  overflow: hidden;
}

.header-content {
  position: relative;
  z-index: 2;
}

.title {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
}

.text {
  font-size: 18px;
  color: #444;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.btn {
  background: linear-gradient(145deg, #111, #333);
  color: white;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 13px;
  cursor: pointer;
}

/* GALERÍA */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 18px;
  padding: 25px;
}

/* 🟤 POLAROID RETRO MEJORADA */
.polaroid {
  background: #fffdf7;
  padding: 10px 10px 22px;
  border-radius: 6px;
  box-shadow:
    0 2px 6px rgba(0,0,0,0.08),
    0 12px 25px rgba(0,0,0,0.12);
  transform: rotate(var(--r));
  transition: transform 0.25s ease, box-shadow 0.25s ease;
  position: relative;
}

/* textura suave */
.polaroid::after {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(
    45deg,
    rgba(0,0,0,0.015),
    rgba(0,0,0,0.015) 2px,
    transparent 2px,
    transparent 5px
  );
  pointer-events: none;
}

/* hover estilo físico */
.polaroid:hover {
  transform: scale(1.04) rotate(0deg);
}

/* imagen */
.polaroid img,
.polaroid video {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  border-radius: 4px;
}

/* 📝 TEXTO POLAROID */
.caption {
  font-size: 12px;
  margin-top: 8px;
  color: #333;
  font-style: italic;
}

/* VISOR */
.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
}

.viewer img,
.viewer video {
  max-width: 95%;
  max-height: 90%;
}

/* iOS OVERLAY (igual) */
.iosOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(12px);
  display: none;
  align-items: center;
  justify-content: center;
}

.iosPreviewBox {
  display: flex;
  align-items: center;
  gap: 18px;
}

.iosPreviewMedia {
  width: 65vw;
  max-width: 420px;
  height: 70vh;
  border-radius: 20px;
  overflow: hidden;
  background: black;
}

.iosMenu {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.iosMenu button {
  background: rgba(255,255,255,0.9);
  border: none;
  padding: 12px 16px;
  border-radius: 14px;
  font-size: 14px;
  cursor: pointer;
}

</style>
</head>

<body>

<div class="header">
  <div class="header-content">
    <div class="title">Recuerdos de un día<br>inolvidable</div>
    <div class="text">Conservados para siempre.</div>

    <div class="buttons">
      <div class="btn" onclick="fileInput.click()">SUBIR FOTO 📁</div>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

<div class="gallery" id="gallery"></div>

<!-- iOS MENU -->
<div class="iosOverlay" id="iosOverlay">
  <div class="iosPreviewBox">

    <div class="iosPreviewMedia" id="iosMedia"></div>

    <div class="iosMenu">
      <button onclick="shareFile()">Compartir</button>
      <button onclick="downloadFile()">Descargar</button>
      <button onclick="deleteFile()">Borrar</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = "https://evmvzqorclndjyghfpch.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bXZ6cW9yY2xuZGp5Z2hmcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjMwOTQsImV4cCI6MjA5MzI5OTA5NH0.tZHpboRzPgnPZ6RjuCWEO-PgcMgIrrUQ8EqQgnnj_Mk";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const gallery = document.getElementById("gallery");
const fileInput = document.getElementById("fileInput");

const iosOverlay = document.getElementById("iosOverlay");
const iosMedia = document.getElementById("iosMedia");

let selectedFile = null;
let selectedUrl = null;

/* 📝 pedir texto */
function askCaption() {
  const text = prompt("Añade un texto a la foto (opcional):");
  return text || "";
}

/* IOS MENU */
function openIOS(file, url, isVideo) {

  selectedFile = file;
  selectedUrl = url;

  iosMedia.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  iosMedia.appendChild(el);
  iosOverlay.style.display = "flex";
}

iosOverlay.addEventListener("click", (e) => {
  if (e.target === iosOverlay) iosOverlay.style.display = "none";
});

/* acciones */
function shareFile() {
  navigator.share?.({ url: selectedUrl });
}

/* descarga */
function downloadFile() {
  const a = document.createElement("a");
  a.href = selectedUrl;
  a.download = "";
  a.click();
}

function deleteFile() {
  const key = prompt("Clave:");
  if (key !== "17102026") return;

  client.storage.from("fotos").remove([selectedFile]);
  iosOverlay.style.display = "none";
  loadFiles();
}

/* UPLOAD CON TEXTO */
fileInput.addEventListener("change", async (e) => {

  for (let f of e.target.files) {

    const caption = askCaption();

    await client.storage.from("fotos").upload(
      Date.now()+"_"+f.name,
      f,
      {
        metadata: { caption }
      }
    );
  }

  loadFiles();
});

/* LOAD */
async function loadFiles() {

  gallery.innerHTML = "";

  const { data } = await client.storage.from("fotos").list("", { limit: 200 });

  for (let file of data) {

    if (!file?.name?.includes(".")) continue;

    const lower = file.name.toLowerCase();

    const isImage = /\.(jpg|jpeg|png|webp|gif)$/.test(lower);
    const isVideo = /\.(mp4|mov|webm)$/.test(lower);

    if (!isImage && !isVideo) continue;

    const { data: url } = client.storage.from("fotos").getPublicUrl(file.name);

    const wrapper = document.createElement("div");
    wrapper.className = "polaroid";
    wrapper.style.setProperty("--r", (Math.random()*6 - 3) + "deg");

    const el = document.createElement(isVideo ? "video" : "img");
    el.src = url.publicUrl;

    const caption = document.createElement("div");
    caption.className = "caption";
    caption.textContent = file.metadata?.caption || "";

    el.addEventListener("click", () =>
      openIOS(file.name, url.publicUrl, isVideo)
    );

    wrapper.appendChild(el);
    wrapper.appendChild(caption);

    gallery.appendChild(wrapper);
  }
}

loadFiles();

</script>

</body>
</html>
