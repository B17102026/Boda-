<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">

<title>Boda 💍</title>

<style>

body {
  margin: 0;
  text-align: center;
  font-family: 'Playfair Display', serif;
  color: #111;
  background: #ffffff;
}

.header {
  position: relative;
  padding: 120px 20px 30px;
  overflow: hidden;
}

.header-illustration {
  position: absolute;
  top: -20px;
  left: 50%;
  transform: translateX(-50%);
  width: 520px;
  opacity: 0.14;
  pointer-events: none;
}

.header-content {
  position: relative;
  z-index: 2;
}

.title {
  font-family: 'Great Vibes', cursive;
  font-size: 60px;
  line-height: 1.1;
  margin-bottom: 10px;
}

.text {
  font-size: 18px;
  color: #444;
  margin-bottom: 40px;
}

.buttons {
  display: flex;
  justify-content: center;
  gap: 25px;
  flex-wrap: wrap;
}

.btn {
  background: linear-gradient(145deg, #111, #333);
  color: white;
  padding: 14px 30px;
  border-radius: 12px;
  font-size: 13px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: transform 0.12s ease;
}

.btn:active {
  transform: translateY(5px) scale(0.97);
}

/* GALERÍA */
.gallery {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  padding: 25px;
}

.gallery img,
.gallery video {
  width: 100%;
  aspect-ratio: 1/1;
  object-fit: cover;
  cursor: pointer;
  border-radius: 18px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
}

/* VISOR TIPO iOS AVANZADO */
.viewer {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  backdrop-filter: blur(20px);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 10000;
  transition: 0.25s ease;
}

.viewerInner {
  width: 92%;
  height: 85%;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
}

.viewer img,
.viewer video {
  max-width: 100%;
  max-height: 100%;
  border-radius: 18px;
  transform: scale(1);
  transition: transform 0.25s ease;
}

.closeViewer {
  position: absolute;
  top: 20px;
  right: 20px;
  font-size: 28px;
  color: white;
  cursor: pointer;
  z-index: 2;
}

/* 🔥 MENU iOS PRO */
.iosOverlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.35);
  backdrop-filter: blur(18px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 20000;
}

.iosSheet {
  width: 85%;
  max-width: 420px;
  background: rgba(255,255,255,0.92);
  border-radius: 24px;
  overflow: hidden;
  display: flex;
  box-shadow: 0 30px 80px rgba(0,0,0,0.35);
}

.iosPreview {
  flex: 1.2;
  background: black;
}

.iosPreview img,
.iosPreview video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.iosMenu {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  gap: 12px;
  padding: 14px;
}

.iosMenu button {
  border: none;
  padding: 12px;
  border-radius: 14px;
  font-size: 14px;
  background: #f2f2f7;
  cursor: pointer;
}

.iosMenu button:active {
  transform: scale(0.96);
}

</style>
</head>

<body>

<div class="header">

<svg class="header-illustration" viewBox="0 0 600 400">
  <defs>
    <pattern id="hatch" width="6" height="6">
      <path d="M0 0 L6 6" stroke="#000" stroke-width="0.5"/>
    </pattern>
  </defs>

  <path d="M220 80 C200 120,210 160,230 200 C250 260,190 310,170 360 L290 360 C270 300,220 260,250 200 C270 160,280 120,260 80 Z"
        fill="url(#hatch)" stroke="#000"/>
</svg>

  <div class="header-content">
    <div class="title">Recuerdos de un día<br>inolvidable</div>
    <div class="text">Conservados para siempre.</div>

    <div class="buttons">
      <div class="btn" onclick="cameraInput.click()">HACER FOTO 📷</div>
      <div class="btn" onclick="fileInput.click()">SUBIR FOTO 📁</div>
    </div>
  </div>
</div>

<input type="file" id="cameraInput" accept="image/*" capture="environment" multiple hidden>
<input type="file" id="fileInput" accept="image/*,video/*" multiple hidden>

<div class="gallery" id="gallery"></div>

<!-- VISOR -->
<div class="viewer" id="viewer">
  <div class="closeViewer" onclick="closeViewer()">✕</div>
  <div class="viewerInner" id="viewerInner"></div>
</div>

<!-- MENU iOS -->
<div class="iosOverlay" id="iosOverlay">
  <div class="iosSheet">

    <div class="iosPreview" id="iosPreview"></div>

    <div class="iosMenu">
      <button onclick="shareFile()">Compartir</button>
      <button onclick="downloadFile()">Descargar</button>
      <button onclick="deleteFile()">Borrar</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseUrl = "https://evmvzqorclndjyghfpch.supabase.co";
const supabaseKey = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImV2bXZ6cW9yY2xuZGp5Z2hmcGNoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MjMwOTQsImV4cCI6MjA5MzI5OTA5NH0.tZHpboRzPgnPZ6RjuCWEO-PgcMgIrrUQ8EqQgnnj_Mk";
const client = supabase.createClient(supabaseUrl, supabaseKey);

const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerInner = document.getElementById("viewerInner");

const iosOverlay = document.getElementById("iosOverlay");
const iosPreview = document.getElementById("iosPreview");

let selectedFile = null;
let selectedUrl = null;
let selectedIsVideo = false;

/* VISOR GRANDE */
function openViewer(url, isVideo) {
  viewerInner.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  viewerInner.appendChild(el);
  viewer.style.display = "flex";
}

function closeViewer() {
  viewer.style.display = "none";
}

/* iOS MENU */
function openIOS(file, url, isVideo) {

  selectedFile = file;
  selectedUrl = url;
  selectedIsVideo = isVideo;

  iosPreview.innerHTML = "";

  const el = document.createElement(isVideo ? "video" : "img");
  el.src = url;
  if (isVideo) el.controls = true;

  iosPreview.appendChild(el);
  iosOverlay.style.display = "flex";
}

iosOverlay.addEventListener("click", e => {
  if (e.target === iosOverlay) iosOverlay.style.display = "none";
});

/* SHARE */
function shareFile() {
  navigator.share?.({ url: selectedUrl });
}

/* DOWNLOAD */
function downloadFile() {
  const a = document.createElement("a");
  a.href = selectedUrl;
  a.download = "";
  a.click();
}

/* DELETE */
function deleteFile() {
  const key = prompt("Clave:");
  if (key !== "17102026") return alert("Incorrecto");

  client.storage.from("fotos").remove([selectedFile]);
  iosOverlay.style.display = "none";
  loadFiles();
}

/* UPLOAD */
fileInput.addEventListener("change", async (e) => {
  for (let f of e.target.files) {
    await client.storage.from("fotos").upload(Date.now()+"_"+f.name, f);
  }
  loadFiles();
});

/* LOAD */
async function loadFiles() {
  gallery.innerHTML = "";

  const { data } = await client.storage.from("fotos").list("", { limit: 200 });

  for (let file of data) {

    if (!file?.name?.includes(".")) continue;

    const lower = file.name.toLowerCase();
    const isImage = /\.(jpg|jpeg|png|webp|gif)$/.test(lower);
    const isVideo = /\.(mp4|mov|webm)$/.test(lower);

    if (!isImage && !isVideo) continue;

    const { data: url } = client.storage.from("fotos").getPublicUrl(file.name);

    const el = document.createElement(isVideo ? "video" : "img");
    el.src = url.publicUrl;

    el.addEventListener("click", () => openViewer(url.publicUrl, isVideo));

    let press;
    el.addEventListener("touchstart", () => {
      press = setTimeout(() => openIOS(file.name, url.publicUrl, isVideo), 500);
    });

    el.addEventListener("touchend", () => clearTimeout(press));

    gallery.appendChild(el);
  }
}

loadFiles();

</script>

</body>
</html>
